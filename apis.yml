aid: arago
name: Arago
description: >-
  Arago (Arago Computing SAS) is a Paris-based deeptech semiconductor startup,
  founded in 2024 by Nicolas Muller, Ambroise Muller, and Eliott Sarrey, building
  energy-efficient AI accelerators powered by light rather than electricity. Its
  photonic processor, codenamed JEF, uses a proprietary multi-physics computing
  core that encodes values with lasers instead of thousands of transistor
  switches, targeting 10x to 30x reductions in energy and cost overhead for AI
  workloads at equivalent performance to leading GPUs. Arago pairs the hardware
  with a full software stack called CARLOTA, which abstracts the complexities of
  photonic computing and exposes a programmable interface compatible with
  mainstream AI frameworks such as PyTorch and TensorFlow, while remaining
  fabbable using standard semiconductor processes. The company operates across
  France, North America, and Israel, and in July 2025 raised an oversubscribed
  $26 million seed round co-led by Earlybird, Protagonist, and Visionaries
  Tomorrow, with backing from executives and investors tied to Apple, Arm,
  Nvidia, Microsoft, Amazon, Uber, PayPal, and Hugging Face. Arago was added to
  the API Evangelist network as a portfolio company of Earlybird; as an
  early-stage hardware company it does not yet publish a public developer API or
  OpenAPI surface.
